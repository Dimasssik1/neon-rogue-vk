<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">
    
    <!-- VK Games SDK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>

    <style>
        canvas:focus {
            outline: none;
        }
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>
</head>
<body class="dark">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <div id="test-label" onclick="hideTestLabel()">NEON ROGUE: VK BUILD</div>

    <script>
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/BuildForVK.loader.js";
        const config = {
            dataUrl: buildUrl + "/BuildForVK.data",
            frameworkUrl: buildUrl + "/BuildForVK.framework.js",
            codeUrl: buildUrl + "/BuildForVK.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "NeonRogue",
            productVersion: "1.0"
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1.3;
        }
        
        loadingCover.style.display = "";

        let ygGameInstance = null;
        let ysdk = null;
        let initYSDK = false;
        let initGame = false;
        let isPausedGame = false;
        const NO_DATA = 'no data';

        function FocusGame() {
            if (!canvas) return;
            canvas.focus();
        }

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                ygGameInstance = unityInstance;
                loadingCover.style.display = "none";
                if (initYSDK) SendInitSDKComplete();
                FocusGame();
            }).catch((message) => {
                console.error(message);
            });
            InitYSDK();
        };

        async function InitYSDK() {
            try {
                // Проверяем наличие Яндекса. Если его нет (как в ВК или на GitHub) - просто идем дальше.
                if (typeof YaGames === "undefined") {
                    console.log("YaGames is undefined. Skipping Yandex Init (OK for VK/GitHub).");
                    initYSDK = true;
                    if (ygGameInstance) SendInitSDKComplete();
                    return;
                }
                ysdk = await YaGames.init();
                initYSDK = true;
                if (ygGameInstance) SendInitSDKComplete();
            } catch (e) {
                console.error('SDK Init Error:', e);
                initYSDK = true; // Все равно разрешаем запуск
                if (ygGameInstance) SendInitSDKComplete();
            }
        }

        function SendInitSDKComplete() {
            if (ygGameInstance) ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');
        }

        function YG2Instance(method, arg) {
            if (ygGameInstance) ygGameInstance.SendMessage('YG2Instance', method, arg);
        }

        function hideTestLabel() {
            document.getElementById('test-label').style.display = 'none';
        }

        document.body.appendChild(script);
    </script>
</body>
</html>
