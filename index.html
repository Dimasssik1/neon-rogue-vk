<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>NEON ROGUE</title>
    <!-- Подключаем VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>
    <style>
        html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; }
        #status { position: absolute; color: #fff; font-family: sans-serif; font-size: 20px; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">ЗАГРУЗКА ИГРЫ...</div>
    <canvas id="unity-canvas"></canvas>

    <script>
        const statusText = document.querySelector("#status");
        const canvas = document.querySelector("#unity-canvas");

        // Пытаемся определить имена файлов в папке Build
        // ВАЖНО: Проверьте, чтобы имена совпали с теми, что лежат в папке Build!
        const config = {
            dataUrl: "Build/VK_Build.data",
            frameworkUrl: "Build/VK_Build.framework.js",
            codeUrl: "Build/VK_Build.wasm",
            loaderUrl: "Build/VK_Build.loader.js",
            companyName: "DefaultCompany",
            productName: "NeonRogue",
            productVersion: "1.0",
        };

        const script = document.createElement("script");
        script.src = config.loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                statusText.innerHTML = "ЗАГРУЗКА: " + Math.round(progress * 100) + "%";
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                statusText.style.display = "none";
            }).catch((message) => {
                alert("Ошибка при запуске: " + message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
