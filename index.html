<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>NEON ROGUE</title>
    
    <!-- Официальный стабильный скрипт VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script>
        // Сразу сообщаем ВК, что игра готова, чтобы убрать белую заставку
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit');
        }
    </script>

    <style>
        html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; width: 100%; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: sans-serif; font-size: 20px; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status">ЗАГРУЗКА...</div>
    <canvas id="unity-canvas"></canvas>

    <script>
        const statusText = document.querySelector("#status");
        const canvas = document.querySelector("#unity-canvas");

        const config = {
            dataUrl: "Build/VK_Build.data",
            frameworkUrl: "Build/VK_Build.framework.js",
            codeUrl: "Build/VK_Build.wasm",
            loaderUrl: "Build/VK_Build.loader.js",
            companyName: "DefaultCompany",
            productName: "NeonRogue",
            productVersion: "1.0",
        };

        const script = document.createElement("script");
        script.src = config.loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                statusText.innerHTML = "ЗАГРУЗКА: " + Math.round(progress * 100) + "%";
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                statusText.style.display = "none";
                // Повторный вызов после загрузки движка
                if (typeof vkBridge !== 'undefined') {
                    vkBridge.send('VKWebAppInit');
                }
            }).catch((message) => {
                statusText.innerHTML = "ОШИБКА: " + message;
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
