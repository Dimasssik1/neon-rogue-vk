<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>NEON ROGUE</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>
    <style>
        html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { z-index: 10; font-size: 24px; }
    </style>
</head>
<body>
    <div id="status">ИНИЦИАЛИЗАЦИЯ ИГРЫ...</div>
    <canvas id="unity-canvas"></canvas>

    <script>
        const statusText = document.querySelector("#status");
        const config = {
            loaderUrl: "Build.loader.js",
            dataUrl: "Build.data.br",
            frameworkUrl: "Build.framework.js.br",
            codeUrl: "Build.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "NeonRogue",
            productVersion: "1.0",
        };

        const canvas = document.querySelector("#unity-canvas");
        const script = document.createElement("script");
        script.src = config.loaderUrl;
        script.onload = () => {
            statusText.innerHTML = "ЗАГРУЗКА ФАЙЛОВ (0%)...";
            createUnityInstance(canvas, config, (progress) => {
                statusText.innerHTML = "ЗАГРУЗКА: " + Math.round(progress * 100) + "%";
            }).then((unityInstance) => {
                statusText.style.display = "none";
                console.log("Unity Loaded!");
            }).catch((message) => {
                statusText.innerHTML = "ОШИБКА: " + message;
                console.error(message);
            });
        };
        script.onerror = () => {
            statusText.innerHTML = "ОШИБКА ЗАГРУЗКИ LOADER.JS";
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
